version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: danvanthiri/faceai-backend:latest
    container_name: faceai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      # If using a local MySQL DB on the host machine, use host.docker.internal
      - FACEAI_DB_HOST=${FACEAI_DB_HOST:-host.docker.internal}
      - FACEAI_DB_PORT=${FACEAI_DB_PORT:-3306}
      - FACEAI_DB_USER=${FACEAI_DB_USER:-root}
      - FACEAI_DB_PASSWORD=${FACEAI_DB_PASSWORD:-}
      - FACEAI_DB_NAME=${FACEAI_DB_NAME:-sbsteqgf_faceai}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your_strong_secret_key_change_me_in_production}
      - WEBAUTHN_ORIGIN=http://localhost:8501
      - ALLOWED_ORIGINS=http://localhost:8501
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: danvanthiri/faceai-frontend:latest
    container_name: faceai_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
